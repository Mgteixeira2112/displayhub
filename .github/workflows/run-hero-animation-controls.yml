name: Run Hero animation controls patch

on:
  push:
    branches: [feat/hero-animation-layer-controls]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-animation-layer-controls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-hero-animation-controls.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Mgteixeira2112@users.noreply.github.com"
          git add src/SmartScenesManager.tsx
          git commit -m "feat: organize Hero animation layer controls"
          git push origin HEAD:feat/hero-animation-layer-controls
