name: One-time guarded public-player polling edit

on:
  push:
    branches:
      - fix/public-player-edge-invocation-budget
    paths:
      - scripts/tmp-apply-player-invocation-fix.py
      - .github/workflows/tmp-apply-player-invocation-fix.yml

permissions:
  contents: write

jobs:
  apply-branch-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-player-edge-invocation-budget
          fetch-depth: 1
      - name: Apply guarded exact-match edits and remove temporary tools
        run: |
          python3 scripts/tmp-apply-player-invocation-fix.py
          git diff --check
          git rm scripts/tmp-apply-player-invocation-fix.py .github/workflows/tmp-apply-player-invocation-fix.yml
          git add src/PublicPlayer.tsx
          git diff --cached --check
          git -c user.name='DisplayHub automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: reduce public display Edge Function invocations without group sync regression'
          git push origin HEAD:fix/public-player-edge-invocation-budget
