name: Fix Hero element hit area

on:
  push:
    branches: [fix/hero-element-drag-hit-area]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-element-drag-hit-area
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/HeroCanvas.tsx')
          s = p.read_text()
          old = "    >\n      <Group ref={animationRef} x={pixelWidth / 2} y={pixelHeight / 2}>{visual}</Group>\n    </Group>"
          new = "    >\n      {editable && <Rect x={0} y={0} width={pixelWidth} height={pixelHeight} fill=\"rgba(0,0,0,0.001)\" listening />}\n      <Group ref={animationRef} x={pixelWidth / 2} y={pixelHeight / 2} listening={false}>{visual}</Group>\n    </Group>"
          if old not in s:
              raise SystemExit('HeroGraphic anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/HeroCanvas.tsx
          git commit -m "fix: restore draggable hit area for Hero graphic"
          git push origin HEAD:fix/hero-element-drag-hit-area
