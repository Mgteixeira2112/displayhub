name: Run Hero text accordion patch

on:
  push:
    branches: [feat/hero-text-controls-accordion]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-text-controls-accordion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-hero-text-accordion.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartScenesManager.tsx src/smart-scenes.css
          git commit -m "feat: compact Hero text controls without touching canvas"
          git push origin HEAD:feat/hero-text-controls-accordion
