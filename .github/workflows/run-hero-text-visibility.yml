name: Run Hero text visibility patch

on:
  push:
    branches: [fix/hero-text-controls-visibility]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-text-controls-visibility
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-hero-text-visibility.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartScenesManager.tsx
          git commit -m "fix: make Hero text tools visible without changing canvas"
          git push origin HEAD:fix/hero-text-controls-visibility
