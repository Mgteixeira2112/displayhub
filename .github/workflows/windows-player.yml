name: Windows Player Installer

on:
  pull_request:
    paths:
      - 'windows-player/**'
      - '.github/workflows/windows-player.yml'
  push:
    branches: [main]
    paths:
      - 'windows-player/**'
      - '.github/workflows/windows-player.yml'
  workflow_dispatch:

jobs:
  build-windows-player:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install player dependencies
        working-directory: windows-player
        run: npm install

      - name: Build Windows installer
        working-directory: windows-player
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: displayhub-windows-player
          path: windows-player/dist/*.exe
          if-no-files-found: error
          retention-days: 14
