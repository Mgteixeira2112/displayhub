name: Run Hero text style editor

on:
  push:
    branches: [feat/hero-text-style-editor]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-text-style-editor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-hero-text-style-editor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/smart-scene-hero-config.ts src/HeroCanvas.tsx src/SmartScenesManager.tsx
          git commit -m "feat: add Hero text visual style editor"
          git push origin HEAD:feat/hero-text-style-editor
