name: Stage specifically approved Editor Universal visuals (PR 327 only)

on:
  push:
    branches: [feat/universal-tables-module-shell]

permissions:
  contents: write
  actions: read

jobs:
  stage-approved-visuals:
    if: >-
      github.event.head_commit.message == 'ci: fix syntax and run pinned approved-baseline staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact human-reviewed artifact without changing production
        uses: actions/download-artifact@v4
        with:
          name: editor-universal-48-candidates-unapproved
          run-id: 35292801888
          github-token: ${{ github.token }}
          repository: Mgteixeira2112/displayhub
          path: /tmp/displayhub-reviewed-visuals
      - name: Check approval, hashes and commit exact images only on PR branch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'); const path = require('node:path'); const crypto = require('node:crypto');
          const root = '/tmp/displayhub-reviewed-visuals';
          const report = JSON.parse(fs.readFileSync(path.join(root, 'review.json'), 'utf8'));
          const approval = fs.readFileSync('visual-standard/approval-record-327.md', 'utf8');
          const sha = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const assert = (yes, why) => { if (!yes) throw Error(why); };
          assert(process.env.GITHUB_REF === 'refs/heads/feat/universal-tables-module-shell', 'Wrong branch');
          assert(approval.includes('10526133280') && approval.includes('95ffb00ba20ad40945b2ec8d14cba3e345b5f0f2046e4d7e4702343f4941d7b4') && approval.includes('não autoriza merge'), 'Missing specific user approval');
          assert(report.source_pr === 327 && report.source_commit === 'c090282170eaeb5d19f6e89e92685f04900a9386' && report.total === 48 && report.approved === false, 'Wrong candidate source');
          const inventory = require('./visual-standard/screen-inventory.cjs');
          const names = [...inventory.screenshots];
          const newNames = [...names.slice(0, 7), 'desktop-interno-universal-tables.png', ...names.slice(7, 22), 'tablet-interno-universal-tables.png', ...names.slice(22, 37), 'mobile-interno-universal-tables.png', ...names.slice(37)];
          const expected = new Set(newNames);
          assert(expected.size === 48 && Object.keys(report.screenshots).length === 48 && Object.keys(report.screenshots).every(name => expected.has(name)), '48 image inventory mismatch');
          assert(report.changed.length === 27 && report.unchanged.length === 18 && report.added.length === 3, 'Candidate diff count mismatch');
          const imgs = fs.readdirSync(path.join(root, 'images')).filter(n => n.endsWith('.png'));
          assert(imgs.length === 48 && imgs.every(n => expected.has(n)), 'Unexpected images in artifact');
          const dest = 'visual-standard/baselines/images';
          for (const name of newNames) {
            const data = fs.readFileSync(path.join(root, 'images', name));
            assert(data.subarray(0, 8).equals(Buffer.from('89504e470d0a1a0a', 'hex')) && sha(data) === report.screenshots[name], `Unapproved/corrupt PNG: ${name}`);
            const existing = path.join(dest, name);
            if (report.unchanged.includes(name)) assert(fs.existsSync(existing) && sha(fs.readFileSync(existing)) === sha(data), `Previously approved image changed: ${name}`);
            if (report.added.includes(name)) assert(!fs.existsSync(existing), `Unexpected preexisting new PNG: ${name}`);
            fs.writeFileSync(existing, data);
          }
          assert(report.added.every(name => name.endsWith('-interno-universal-tables.png')), 'Unexpected additional baseline');
          fs.writeFileSync('visual-standard/baselines/approved-review-20260918.json', JSON.stringify({
            version: 1, review_state: 'approved_user_20260917_pr327', source_commit: report.source_commit,
            ci_run: 35292801888, artifact_id: 10526133280,
            artifact_sha256: '95ffb00ba20ad40945b2ec8d14cba3e345b5f0f2046e4d7e4702343f4941d7b4',
            screenshots: report.screenshots
          }, null, 2) + '\n');
          let text = fs.readFileSync('visual-standard/screen-inventory.cjs', 'utf8');
          const anchor = "  ['smart-scenes', 'Smart Scenes'],";
          assert(text.includes(anchor) && !text.includes("['universal-tables'"), 'Unexpected original inventory');
          text = text.replace(anchor, anchor + "\n  ['universal-tables', 'Editor Universal'],");
          fs.writeFileSync('visual-standard/screen-inventory.cjs', text);
          text = fs.readFileSync('visual-standard/visual-baseline.cjs', 'utf8');
          assert(text.includes('screenshots.length !== 45 || inventory.size !== 45'), 'Visual baseline guard changed');
          text = text.replaceAll('45', '48');
          fs.writeFileSync('visual-standard/visual-baseline.cjs', text);
          const manifestPath = 'visual-standard/baselines/manifest.json';
          const oldManifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          assert(oldManifest.status === 'approved' && oldManifest.screenshots.length === 45 && oldManifest.approval.pr === 326, 'Old baseline unexpectedly changed');
          fs.writeFileSync(manifestPath, JSON.stringify({
            version: 1, status: 'approved', screenshots: newNames,
            approval: { pr: 327, confirmation: 'Usuário aprovou expressamente o conjunto completo das 48 referências em 17/09/2026, após ver galeria e página em 3 tamanhos. Prova: visual-standard/approval-record-327.md; origem: workflow 35292801888, artifact 10526133280. Aprovação visual não autoriza merge.' }
          }, null, 2) + '\n');
          text = fs.readFileSync('visual-standard/check-candidate-review.cjs', 'utf8');
          assert(text.includes("'candidate-review-20260917.json'"), 'Review validator unexpectedly changed');
          text = text.replace("'candidate-review-20260917.json'", "'approved-review-20260918.json'");
          text = text.replace("review.review_state !== 'awaiting_human_review_not_approved'", "review.review_state !== 'approved_user_20260917_pr327'");
          text = text.replaceAll('45', '48');
          text = text.replace("if (committed.length) {", "if (active.status !== 'approved' || active.approval?.pr !== 327) throw new Error('Conjunto aprovado somente após confirmação específica da PR #327')\nif (committed.length) {");
          fs.writeFileSync('visual-standard/check-candidate-review.cjs', text);
          text = fs.readFileSync('.github/workflows/ci.yml', 'utf8');
          assert(text.includes('13 páginas internas') && text.includes('ge 39') && text.includes('ge 45'), 'Unexpected CI screenshot gate');
          text = text.replace('13 páginas internas', '14 páginas internas').replace('ge 39', 'ge 42').replace('ge 45', 'ge 48').replace('45 imagens de referência', '48 imagens de referência');
          fs.writeFileSync('.github/workflows/ci.yml', text);
          text = fs.readFileSync('visual-standard/tests/internal-auth.spec.cjs', 'utf8').replace('45 referências aprovadas', '48 referências aprovadas');
          fs.writeFileSync('visual-standard/tests/internal-auth.spec.cjs', text);
          const readmePath = 'visual-standard/baselines/README.md';
          text = fs.readFileSync(readmePath, 'utf8');
          text = text.replace(/45/g, '48').replace('13 áreas internas', '14 áreas internas');
          text = text.replace('Após a PR #326 ser autorizada e integrada, o conjunto inicial será `approved`', 'Conjunto aprovado especificamente na PR #327: `approved`');
          text = text.replace('A aprovação específica do usuário está registrada em https://github.com/Mgteixeira2112/displayhub/pull/326#issuecomment-5722598687.', 'A aprovação visual específica está documentada em `visual-standard/approval-record-327.md`; a aprovação histórica das 45 referências anteriores permanece registrada na PR #326.');
          fs.writeFileSync(readmePath, text);
          delete require.cache[require.resolve('./visual-standard/screen-inventory.cjs')];
          const loaded = require('./visual-standard/screen-inventory.cjs');
          assert(loaded.screenshots.length === 48 && loaded.screenshots.every(n => expected.has(n)), 'Committed screenshot names differ from approved candidates');
          console.log('48 approved images SHA-256 verified, exact inventory and CI gates adjusted. No production access.');
          NODE
          node visual-standard/visual-baseline.cjs
          node visual-standard/check-candidate-review.cjs
          git rm .github/workflows/stage-approved-universal-visuals.yml
          git add visual-standard .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: activate exactly 48 user-approved visual baselines for Editor Universal'
          git push origin HEAD:refs/heads/feat/universal-tables-module-shell
