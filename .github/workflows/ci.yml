name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verificar CSS Cockpit no build
        run: node scripts/check-home-cockpit.mjs

      - name: Verificar CSS Cockpit de Telas no build
        run: node scripts/check-displays-cockpit.mjs

      - name: Verificar CSS Cockpit de Conteúdo no build
        run: node scripts/check-content-cockpit.mjs

      - name: Verificar CSS Cockpit de Criar no build
        run: node scripts/check-create-cockpit.mjs

      - name: Verificar CSS Cockpit de Campanhas no build
        run: node scripts/check-campaigns-cockpit.mjs

      - name: Verificar CSS Cockpit de Smart Scenes no build
        run: node scripts/check-smart-scenes-cockpit.mjs

      - name: Verificar CSS Cockpit de Players Windows no build
        run: node scripts/check-windows-players-cockpit.mjs

      - name: Verificar CSS Cockpit de Video Wall e Grupos no build
        run: node scripts/check-display-groups-cockpit.mjs

      - name: Verificar CSS Cockpit das demais páginas no build
        run: node scripts/check-remaining-cockpit.mjs

  visual-public:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências do aplicativo
        run: npm ci

      - name: Playwright efêmero sem alterar lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Validar manifesto de referências (pendente não significa aprovado)
        run: node visual-standard/visual-baseline.cjs

      - name: Auditar 45 hashes das capturas candidatas sem aprovação automática
        run: node visual-standard/check-candidate-review.cjs

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Inspecionar login público e navegação interna com dados fictícios
        run: npx playwright test --config visual-standard/playwright.config.cjs

      - name: Exigir imagens de 13 páginas internas e duas telas públicas em três tamanhos
        run: |
          test "$(find visual-standard/artifacts/test-results -name '*-interno-*.png' | wc -l)" -ge 39
          test "$(find visual-standard/artifacts/test-results -name '*.png' | wc -l)" -ge 45
          test -f visual-standard/artifacts/report/index.html
          git diff --exit-code -- visual-standard/baselines

      - name: Anexar evidências fictícias sem dados de clientes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-public-and-internal-fixtures
          path: visual-standard/artifacts/
          retention-days: 7
          if-no-files-found: error

  stage-approved-images-pr326-only:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 326 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/visual-baseline-candidate-review-20260917'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout somente do HEAD da PR 326
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Baixar artefato imutável, conferir hash e versionar SOMENTE na branch desta PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(node -p "require('./visual-standard/baselines/manifest.json').status")" = pending
          archive="$RUNNER_TEMP/displayhub-45-originals.zip"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/Mgteixeira2112/displayhub/actions/artifacts/10518640238/zip' \
            --output "$archive"
          echo "e32ba71dd9bac7e59fa9dc7d6b68da393ec13d976ed61ae911d29210f722fc5a  $archive" | sha256sum --check -
          mkdir -p visual-standard/artifacts
          unzip -q "$archive" -d visual-standard/artifacts
          node visual-standard/stage-baseline-candidates.cjs
          node visual-standard/check-candidate-review.cjs
          test "$(find visual-standard/baselines/images -maxdepth 1 -name '*.png' | wc -l)" -eq 45
          git add -- visual-standard/baselines/manifest.json visual-standard/baselines/images
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'test: versionar 45 imagens candidatas aprovadas para comparação visual'
          git push origin HEAD:refs/heads/docs/visual-baseline-candidate-review-20260917
