name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testar parser de CSV comercial
        run: node --experimental-strip-types --test tests/commercial-csv.test.mjs

      - name: Testar rotação gradual de tabelas e ofertas
        run: node --experimental-strip-types --test tests/commercial-rotation.test.mjs

      - name: Testar integração da rotação da tabela no player
        run: node --experimental-strip-types --test tests/commercial-player-runtime.test.mjs

      - name: Verificar CSS Cockpit no build
        run: node scripts/check-home-cockpit.mjs

      - name: Verificar CSS Cockpit de Telas no build
        run: node scripts/check-displays-cockpit.mjs

      - name: Verificar CSS Cockpit de Conteúdo no build
        run: node scripts/check-content-cockpit.mjs

      - name: Verificar CSS Cockpit de Criar no build
        run: node scripts/check-create-cockpit.mjs

      - name: Verificar CSS Cockpit de Campanhas no build
        run: node scripts/check-campaigns-cockpit.mjs

      - name: Verificar CSS Cockpit de Smart Scenes no build
        run: node scripts/check-smart-scenes-cockpit.mjs

      - name: Verificar CSS Cockpit de Players Windows no build
        run: node scripts/check-windows-players-cockpit.mjs

      - name: Verificar CSS Cockpit de Video Wall e Grupos no build
        run: node scripts/check-display-groups-cockpit.mjs

      - name: Verificar CSS Cockpit das demais páginas no build
        run: node scripts/check-remaining-cockpit.mjs

  visual-public:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências do aplicativo
        run: npm ci

      - name: Playwright efêmero sem alterar lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Validar manifesto e estado de aprovação das referências
        run: node visual-standard/visual-baseline.cjs

      - name: Auditar integridade SHA-256 das 48 imagens de referência
        run: node visual-standard/check-candidate-review.cjs

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Inspecionar telas vazias e preenchidas com perfis e dados fictícios
        run: npx playwright test --config visual-standard/playwright.config.cjs

      - name: Exigir 48 comparações aprovadas e 27 evidências preenchidas
        run: |
          test "$(find visual-standard/artifacts/test-results -name '*-interno-*.png' | wc -l)" -ge 42
          test "$(find visual-standard/artifacts/test-results -name 'filled-*.png' | wc -l)" -eq 27
          test "$(find visual-standard/artifacts/test-results -name '*.png' | wc -l)" -ge 75
          test -f visual-standard/artifacts/report/index.html
          git diff --exit-code -- visual-standard/baselines

      - name: Anexar evidências fictícias sem dados de clientes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-public-and-internal-fixtures
          path: visual-standard/artifacts/
          retention-days: 7
          if-no-files-found: error
