name: Run Hero text animations v1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/hero-text-animations-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-text-animations-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-hero-text-animations-v1.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/smart-scene-hero-config.ts src/SmartScenesManager.tsx src/HeroCanvas.tsx
          git commit -m "feat: add advanced Hero text animations"
          git push origin HEAD:feat/hero-text-animations-v1
