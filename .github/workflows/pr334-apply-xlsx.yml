name: PR334 XLSX integration one-shot
on:
  push:
    branches: [feat/universal-table-xlsx-import]
    paths: [.github/workflows/pr334-apply-xlsx.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'Mgteixeira2112/displayhub' && github.ref == 'refs/heads/feat/universal-table-xlsx-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install read-excel-file@9.3.10 --save-exact
      - name: Integrate XLSX into existing CSV workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/UniversalTableCsvImport.tsx')
          text=p.read_text()
          def replace_once(old,new):
              global text
              if text.count(old)!=1: raise SystemExit(f'Expected one match; got {text.count(old)}: {old[:80]}')
              text=text.replace(old,new)
          replace_once("import './universal-import.css'", "import type { WorkbookSheet } from './lib/commercialXlsx'\nimport './universal-import.css'")
          replace_once("  const [fileName, setFileName] = useState('')", "  const [fileName, setFileName] = useState('')\n  const [workbookSheets, setWorkbookSheets] = useState<WorkbookSheet[]>([])\n  const [selectedSheet, setSelectedSheet] = useState('')")
          replace_once("    setFileName(''); setHeaders([]); setRawRows([]); setEdits({}); setMapping(emptyMapping()); setAckIgnored(false); setSaved(false); setMessage('')", "    setFileName(''); setHeaders([]); setRawRows([]); setEdits({}); setMapping(emptyMapping()); setAckIgnored(false); setSaved(false); setWorkbookSheets([]); setSelectedSheet(''); setMessage('')")
          replace_once("    if (!/\\.csv$/i.test(file.name)) { setMessage('Nesta etapa, selecione um CSV. O Excel XLSX será incluído em uma PR separada.'); return }", "    if (!/\\.(csv|xlsx)$/i.test(file.name)) { setMessage('Selecione um arquivo CSV ou XLSX.'); return }")
          replace_once("      const bytes = await file.arrayBuffer()", "      if (/\\.xlsx$/i.test(file.name)) {\n        const { readCommercialXlsx } = await import('./lib/commercialXlsx')\n        const sheets = await readCommercialXlsx(file)\n        if (!sheets.length) throw new Error('O arquivo XLSX não contém uma aba com itens.')\n        setWorkbookSheets(sheets)\n        setFileName(file.name)\n        if (sheets.length > 1) { setMessage('Selecione a aba do Excel que deseja importar. Nada foi gravado.'); return }\n        const sheet = sheets[0]\n        setSelectedSheet(sheet.name); setHeaders(sheet.headers); setRawRows(sheet.rows); setMapping(suggestMapping(sheet.headers))\n        setMessage(`Aba ${sheet.name} lida localmente: ${sheet.rows.length} linhas. Revise antes de gravar.`)\n        return\n      }\n      const bytes = await file.arrayBuffer()")
          replace_once("  function remap(field: ImportField, index: number) {", "  function chooseSheet(name: string) {\n    const sheet = workbookSheets.find((candidate) => candidate.name === name)\n    setSelectedSheet(name); setHeaders(sheet?.headers || []); setRawRows(sheet?.rows || [])\n    setMapping(sheet ? suggestMapping(sheet.headers) : emptyMapping()); setEdits({}); setAckIgnored(false); setSaved(false)\n    setMessage(sheet ? `Aba ${sheet.name}: ${sheet.rows.length} linhas. Revise antes de gravar.` : '')\n  }\n\n  function remap(field: ImportField, index: number) {")
          replace_once("aria-label=\"Importação de tabela CSV\"", "aria-label=\"Importação de tabela CSV ou XLSX\"")
          replace_once("{open ? 'Fechar' : 'Importar CSV'}", "{open ? 'Fechar' : 'Importar planilha'}")
          replace_once("<label>Arquivo CSV (até 2 MB e 200 itens)\n            <input type=\"file\" accept=\".csv,text/csv\"", "<label>Arquivo CSV ou XLSX (até 2 MB e 200 itens)\n            <input type=\"file\" accept=\".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"")
          replace_once("          <label>Destino: estrutura vazia sem vínculo com playlist", "          {workbookSheets.length > 1 && <label>Aba do Excel\n            <select value={selectedSheet} disabled={busy} onChange={(event) => chooseSheet(event.target.value)}>\n              <option value=\"\">Selecione uma aba</option>\n              {workbookSheets.map((sheet) => <option key={sheet.name} value={sheet.name}>{sheet.name}</option>)}\n            </select>\n          </label>}\n          <label>Destino: estrutura vazia sem vínculo com playlist")
          p.write_text(text)
          PY
          npm run lint
          npm run build
      - name: Commit implementation only, no merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr334-apply-xlsx.yml
          git add package.json package-lock.json src/UniversalTableCsvImport.tsx src/lib/commercialXlsx.ts
          git diff --cached --stat
          git commit -m 'feat: integrar importador XLSX com prévia compartilhada e lockfile'
          git push origin HEAD:feat/universal-table-xlsx-import
