name: Run Hero top layout patch

on:
  push:
    branches: [feat/hero-canvas-top-layout]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-canvas-top-layout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-hero-top-layout-import.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git commit -m "feat: load Hero top canvas layout"
          git push origin HEAD:feat/hero-canvas-top-layout
