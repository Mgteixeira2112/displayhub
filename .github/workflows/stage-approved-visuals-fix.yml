name: Stage approved 48 visuals with isolated dependencies

on:
  push:
    branches: [feat/universal-tables-module-shell]

permissions:
  contents: write
  actions: read

jobs:
  stage:
    if: >-
      github.event.head_commit.message == 'ci: retry approved visuals with Playwright dependency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies for existing approved-baseline checks
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.55.0
      - uses: actions/download-artifact@v4
        with:
          name: editor-universal-48-candidates-unapproved
          run-id: 35292801888
          repository: Mgteixeira2112/displayhub
          github-token: ${{ github.token }}
          path: /tmp/displayhub-reviewed-visuals
      - name: Execute existing SHA-pinned approval and staging code
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const original = fs.readFileSync('.github/workflows/stage-approved-universal-visuals.yml', 'utf8')
          const chunks = original.split('        run: |\n')
          if (chunks.length !== 2) throw Error('Expected one existing guarded staging script')
          const lines = chunks[1].split('\n')
          const body = []
          for (const line of lines) {
            if (line && !line.startsWith('          ')) break
            body.push(line.startsWith('          ') ? line.slice(10) : '')
          }
          const script = body.join('\n')
          if (!script.includes('48 approved images SHA-256 verified') || !script.includes('git push origin HEAD:refs/heads/feat/universal-tables-module-shell')) throw Error('Unexpected original staging script')
          fs.writeFileSync('/tmp/displayhub-approved-visuals.sh', script)
          NODE
          bash /tmp/displayhub-approved-visuals.sh
