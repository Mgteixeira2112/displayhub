<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>Dispositivo registrado · DisplayHub</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e5edf8; background: #0b1220; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0b1220; }
    body { overflow: hidden; }
    #waiting { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top left, rgba(37,99,235,.24), transparent 36%), #0b1220; z-index: 2; }
    main { width: min(620px, 100%); padding: 30px; border: 1px solid rgba(255,255,255,.09); border-radius: 22px; background: rgba(15,23,42,.96); box-shadow: 0 30px 90px rgba(0,0,0,.35); text-align: center; }
    .mark { width: 54px; height: 54px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 15px; background: #2563eb; font-weight: 900; }
    h1 { margin: 0 0 10px; font-size: clamp(1.5rem, 5vw, 2.2rem); }
    p { color: #9fb0c6; line-height: 1.6; }
    .status { margin-top: 22px; padding: 16px; border-radius: 14px; background: rgba(30,41,59,.8); color: #bfdbfe; }
    .success { background: rgba(20,83,45,.3); color: #bbf7d0; }
    .error { background: rgba(127,29,29,.28); color: #fecaca; }
    #player { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; display: none; z-index: 1; }
  </style>
</head>
<body>
  <iframe id="player" title="DisplayHub Player" allow="autoplay; fullscreen" allowfullscreen></iframe>

  <div id="waiting">
    <main>
      <div class="mark">DH</div>
      <h1>Dispositivo registrado</h1>
      <p>Este aparelho já faz parte do DisplayHub.</p>
      <div id="status" class="status">Restaurando a sessão deste dispositivo...</div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://meqeluddtwthqmrtbhbr.supabase.co'
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_yjnvIPUmi8-Kt7yTFibw3w_DQlawViE'
    const IDENTITY_KEY = 'displayhub_generic_device_identity_v1'
    const query = new URLSearchParams(window.location.search)
    const expectedDeviceId = (query.get('device') || '').trim()
    const recoveryToken = (query.get('recover') || '').trim()
    const status = document.getElementById('status')
    const waiting = document.getElementById('waiting')
    const player = document.getElementById('player')
    let currentPlayerUrl = ''
    let currentAppVersion = ''
    let identityReady = false

    function getIdentity() {
      try {
        const saved = JSON.parse(localStorage.getItem(IDENTITY_KEY) || 'null')
        if (saved?.deviceId && saved?.deviceSecret) return saved
      } catch {
        return null
      }
      return null
    }

    function saveIdentity(deviceId, deviceSecret) {
      localStorage.setItem(IDENTITY_KEY, JSON.stringify({ deviceId, deviceSecret }))
    }

    function showWaiting(message, className = 'status') {
      waiting.style.display = 'grid'
      player.style.display = 'none'
      status.textContent = message
      status.className = className
    }

    function showPlayer(url, name) {
      if (url !== currentPlayerUrl) {
        currentPlayerUrl = url
        player.src = url
      }
      player.style.display = 'block'
      waiting.style.display = 'none'
      document.title = `${name || 'DisplayHub'} · DisplayHub`
    }

    async function appVersion() {
      const response = await fetch(`./index.html?v=${Date.now()}`, { cache: 'no-store' })
      if (!response.ok) return ''
      const html = await response.text()
      const bytes = new TextEncoder().encode(html)
      const digest = await crypto.subtle.digest('SHA-256', bytes)
      return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('')
    }

    async function pollAppVersion() {
      try {
        const nextVersion = await appVersion()
        if (!nextVersion) return
        if (!currentAppVersion) {
          currentAppVersion = nextVersion
          return
        }
        if (nextVersion !== currentAppVersion) window.location.reload()
      } catch {
        return
      }
    }

    async function recoverIdentityIfNeeded() {
      const current = getIdentity()
      if (current && (!expectedDeviceId || current.deviceId === expectedDeviceId)) {
        identityReady = true
        return current
      }

      if (!expectedDeviceId || !/^[a-f0-9-]{36}$/i.test(expectedDeviceId) || !/^[a-f0-9]{64}$/i.test(recoveryToken)) {
        showWaiting('A identidade deste dispositivo não foi encontrada. Use o QR de recuperação exibido no cadastro deste aparelho.', 'status error')
        return null
      }

      showWaiting('Recuperando a identidade deste dispositivo...')
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/recover_registered_device_identity`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_PUBLISHABLE_KEY,
            Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            p_device_id: expectedDeviceId,
            p_recovery_token: recoveryToken,
          }),
        })
        if (!response.ok) throw new Error('recovery_failed')
        const result = await response.json()
        if (!result?.device_id || !result?.device_secret) throw new Error('invalid_recovery_result')
        saveIdentity(result.device_id, result.device_secret)
        identityReady = true
        return { deviceId: result.device_id, deviceSecret: result.device_secret }
      } catch {
        showWaiting('Não foi possível recuperar este dispositivo com o QR informado.', 'status error')
        return null
      }
    }

    async function pollAssignment() {
      if (!identityReady) {
        const restored = await recoverIdentityIfNeeded()
        if (!restored) return
      }

      const identity = getIdentity()
      if (!identity) {
        identityReady = false
        showWaiting('A identidade deste dispositivo não foi encontrada. Use novamente o QR de recuperação.', 'status error')
        return
      }

      if (expectedDeviceId && identity.deviceId !== expectedDeviceId) {
        identityReady = false
        showWaiting('Este QR de recuperação pertence a outro dispositivo.', 'status error')
        return
      }

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/poll_registered_device_assignment`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_PUBLISHABLE_KEY,
            Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            p_device_id: identity.deviceId,
            p_device_secret: identity.deviceSecret,
          }),
        })

        if (!response.ok) {
          if (response.status === 400 || response.status === 401 || response.status === 403) identityReady = false
          throw new Error('poll_failed')
        }
        const result = await response.json()

        if (result?.status === 'assigned' && result?.player_url) {
          showPlayer(result.player_url, result.playlist_name)
          return
        }

        currentPlayerUrl = ''
        player.removeAttribute('src')
        showWaiting('Aguardando o administrador associar uma playlist a este dispositivo...')
      } catch {
        if (!currentPlayerUrl) {
          showWaiting('Não foi possível verificar a associação agora. Tentando novamente automaticamente...')
        }
      }
    }

    void pollAssignment()
    void pollAppVersion()
    window.setInterval(() => void pollAssignment(), 3000)
    window.setInterval(() => void pollAppVersion(), 15000)
  </script>
</body>
</html>
